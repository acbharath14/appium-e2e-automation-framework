# Runs the Android suite on an emulator. iOS stays local-only by design
# (macOS runner cost/speed) — see the README.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 20 (Appium server)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight (Appium server, drivers, sample app)
        run: python3 scripts/preflight.py --ci
        # --ci: the emulator runner below provides the emulator, so the
        # ANDROID_HOME/AVD checks are skipped; the Appium server is started
        # in the emulator step so it inherits the runner's ANDROID_SDK_ROOT.

      - name: Run Android suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: Pixel_7_API_34
          emulator-boot-timeout: 1200
          # NOTE: the runner executes each script line as a separate `sh -c`,
          # so this must stay a single line — a multi-line for-loop breaks.
          script: appium > /tmp/appium.log 2>&1 & for i in $(seq 1 60); do curl -sf http://127.0.0.1:4723/status >/dev/null && break; sleep 2; done; mvn -B test -Dplatform=android

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: target/allure-results

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-android
          path: target/site/jacoco
