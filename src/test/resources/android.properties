# Android capabilities (loaded by DriverFactory when -Dplatform=android)
# Emulator handling: if an emulator is already running (CI's emulator runner,
# or one started by hand), the suite uses it; otherwise Appium boots this AVD
# itself, so nobody needs to start an emulator by hand before running.

platformName=Android
appium\:automationName=UiAutomator2
appium\:deviceName=Pixel_7_API_34
appium\:avd=Pixel_7_API_34
appium\:avdLaunchTimeout=180000
appium\:app=apps/Android.SauceLabs.Mobile.Sample.app.apk
# The splash screen (SplashActivity) hands off to MainActivity faster than
# Appium's first poll, so waiting for the splash alone times out. The wildcard
# accepts any activity of the app as "started".
appium\:appWaitActivity=com.swaglabsmobileapp.*
appium\:newCommandTimeout=120
appium\:adbExecTimeout=60000
