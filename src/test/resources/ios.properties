# iOS capabilities (loaded by DriverFactory when -Dplatform=ios)
# Local runs only: needs macOS + Xcode. CI runs Android (see README).

platformName=iOS
appium:automationName=XCUITest
appium:deviceName=iPhone 16
appium:platformVersion=18.0
appium:app=apps/iOS.Simulator.SauceLabs.Mobile.Sample.app.zip
appium:newCommandTimeout=120
